[package]
name = "just-keep-scooping"
version = "1.0.0"
description = "A raccoon incremental about garbage, capitalism, and a tiny tie."
license = "MIT"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
