[package]
name = "aion-assist"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
license = "MIT"
description = "Timer-based skill rotation sender for Aion 2 on Windows"
publish = false

[dependencies]
# Pinned so the tool still builds on Rust 1.83. Newer serde/indexmap
# releases require the 2024 edition.
serde = { version = "=1.0.219", features = ["derive"] }
toml = "=0.8.23"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media",
    "Win32_UI_HiDpi",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
