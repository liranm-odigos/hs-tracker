name: release

# On a version tag this builds the Windows installer and cuts the GitHub
# Release. This fork ships Windows only; the Linux packages stay with
# upstream. workflow_dispatch still builds without publishing, so a branch
# can be handed to a tester as an artifact without cutting a release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # No `npm run build` here: tauri.conf.json's beforeBuildCommand runs it,
      # so every job was building the front end twice.
      - run: npm ci

      # package.json owns the version; fail the build if the tag disagrees.
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          node scripts/set-version.mjs
          pkg=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          [ "$pkg" = "$tag" ] || { echo "tag $tag != package.json $pkg"; exit 1; }

      - run: node scripts/ci-prepare-signing.mjs

      # the Npcap SDK import libraries are vendored, and wpcap.dll is
      # delay-loaded, so no driver is needed on the runner
      - run: cargo test --manifest-path src-tauri/Cargo.toml

      - run: npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: hs-tracker-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig

  # Attach the installer to a GitHub Release named after the tag. Dispatch on
  # a branch only uploads the artifact; nothing here writes a release unless
  # the run is for v*.
  publish:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/download-artifact@v4
        with:
          path: collected
          merge-multiple: true

      - name: Assemble release/
        run: |
          mkdir -p release
          find collected -type f \( -name '*.exe' -o -name '*.sig' \) -exec cp -v {} release/ \;
          ls -la release

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ci-publish.mjs
