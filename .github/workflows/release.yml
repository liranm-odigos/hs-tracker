name: release

# On a version tag this builds the Windows installer and cuts the GitHub
# Release. This fork ships Windows only; the Linux packages stay with
# upstream. workflow_dispatch still builds without publishing, so a branch
# can be handed to a tester as an artifact without cutting a release.
#
# Tests do not run on the Windows job. Compiling the crate in debug for
# `cargo test` and then again in release for the installer was the 4–5
# minutes on top of a 7–10 minute `tauri build`. The suite runs here on
# Ubuntu in parallel, and on every PR via ci.yml, so a red test still
# blocks the GitHub Release without making the installer wait.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: linux-test

      # GTK / WebKit headers: the crate links Tauri, so Ubuntu rustc needs them
      # even though this fork only publishes the Windows installer.
      - run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libpcap-dev

      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # Tag runs cannot see caches saved on other tags. shared-key keeps the
      # prefix stable so a cache warmed on main (or a workflow_dispatch from
      # main) is the one a tag restores. Without that, every release compiled
      # from a cold target directory — "No cache found" on v1.1.8 and v1.1.9.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: windows-tauri

      # No `npm run build` here: tauri.conf.json's beforeBuildCommand runs it,
      # so every job was building the front end twice.
      - run: npm ci

      # package.json owns the version; fail the build if the tag disagrees.
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          node scripts/set-version.mjs
          pkg=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          [ "$pkg" = "$tag" ] || { echo "tag $tag != package.json $pkg"; exit 1; }

      - run: node scripts/ci-prepare-signing.mjs

      - run: npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: hs-tracker-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig

  # Attach the installer to a GitHub Release named after the tag. Dispatch on
  # a branch only uploads the artifact; nothing here writes a release unless
  # the run is for v*. Waits for tests as well as the installer, so a red
  # suite cannot ship.
  publish:
    needs: [test, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/download-artifact@v4
        with:
          path: collected
          merge-multiple: true

      - name: Assemble release/
        run: |
          mkdir -p release
          find collected -type f \( -name '*.exe' -o -name '*.sig' \) -exec cp -v {} release/ \;
          ls -la release

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ci-publish.mjs
