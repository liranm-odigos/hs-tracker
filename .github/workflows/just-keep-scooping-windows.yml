name: Just Keep Scooping Windows

on:
  workflow_dispatch:
  push:
    paths:
      - 'just-keep-scooping/**'
      - '.github/workflows/just-keep-scooping-windows.yml'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: just-keep-scooping
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: just-keep-scooping/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: just-keep-scooping/src-tauri

      - run: npm ci
      - run: npm test
      - run: npx tauri build --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: just-keep-scooping-windows
          path: just-keep-scooping/src-tauri/target/release/bundle/nsis/*.exe
